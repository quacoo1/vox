name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test and clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The same packages the README lists for a Linux build, plus a virtual display for tests that open one.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libasound2-dev libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev xvfb

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace
