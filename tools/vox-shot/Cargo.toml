[package]
name = "vox-shot"
version = "0.1.0"
edition = "2021"
publish = false
description = "Renders a .slint component with JSON demo data to a PNG (design iteration and screenshot harness)"

[dependencies]
slint-interpreter = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2", "image-default-formats"] }
i-slint-core = "=1.18.1"
spin_on = "0.1"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
