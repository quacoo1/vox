[package]
name = "vox-win"
description = "Vox Windows integration: input hooks + selection gestures + clipboard capture, foreground app, hotkeys, SMTC media keys, registry (Explorer verb, autostart, theme), single instance, system events, window and shell helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vox-core.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde_json.workspace = true
# Unicode categories for the hotkey recorder's AltGr rule (`\p{C}`, `\p{L}`); already in the graph through vox-core.
regex.workspace = true

[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[target.'cfg(not(windows))'.dependencies]
# X11 (the app runs on XWayland under GNOME so overlays can be placed and kept on top): window helpers, monitors,
# pointer. arboard: the CLIPBOARD and PRIMARY selections. libc: locale and flock. signal-hook: SIGTERM → quit.
x11rb = { version = "0.13", features = ["randr"] }
arboard = { version = "3", default-features = false }
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Data_Xml_Dom",
    "Foundation",
    "Media",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
